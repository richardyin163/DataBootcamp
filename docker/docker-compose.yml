services:
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    environment:
      NESSIE_VERSION_STORE_TYPE: in-memory
      NESSIE_HTTP_PORT: 19120
    ports:
      - "19120:19120"
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://127.0.0.1:19120/q/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    networks:
      lakehouse:
        ipv4_address: 172.28.0.10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.7
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - ./data/zookeeper/data:/var/lib/zookeeper/data
      - ./data/zookeeper/log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-lc", "echo srvr | nc -w 2 127.0.0.1 2181 | grep -q '^Mode:'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      lakehouse:
        ipv4_address: 172.28.0.11

  kafka:
    image: confluentinc/cp-kafka:7.9.7
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-lc", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
    restart: unless-stopped
    networks:
      lakehouse:
        ipv4_address: 172.28.0.12

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped
    networks:
      lakehouse:
        ipv4_address: 172.28.0.13

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    networks:
      lakehouse:
        ipv4_address: 172.28.0.14

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done &&
      /usr/bin/mc mb -p local/warehouse || true &&
      /usr/bin/mc anonymous set private local/warehouse || true &&
      /usr/bin/mc mb -p local/flink-checkpoints || true &&
      /usr/bin/mc anonymous set private local/flink-checkpoints || true &&
      /usr/bin/mc mb -p local/flink-savepoints || true &&
      /usr/bin/mc anonymous set private local/flink-savepoints || true
      "
    restart: "no"
    networks:
      lakehouse:
        ipv4_address: 172.28.0.15

  jobmanager:
    image: flink:2.2.1-scala_2.12-java17
    container_name: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
      - "9249:9249"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: s3://warehouse/flink-checkpoints
        state.savepoints.dir: s3://warehouse/flink-savepoints
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true
        s3.connection.ssl.enabled: false
        execution.checkpointing.interval: 30s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        classloader.check-leaked-classloader: false
    volumes:
      - ./flink/usrlib:/opt/flink/usrlib
      - ./flink/sql:/opt/flink/sql
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://127.0.0.1:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    networks:
      lakehouse:
        ipv4_address: 172.28.0.20

  taskmanager:
    image: flink:2.2.1-scala_2.12-java17
    container_name: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.backend: rocksdb
        state.checkpoints.dir: s3://warehouse/flink-checkpoints
        state.savepoints.dir: s3://warehouse/flink-savepoints
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true
        s3.connection.ssl.enabled: false
        execution.checkpointing.interval: 30s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
        classloader.check-leaked-classloader: false
    ports:
      - "9250:9250"
    volumes:
      - ./flink/usrlib:/opt/flink/usrlib
      - ./flink/sql:/opt/flink/sql
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://jobmanager:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    networks:
      lakehouse:
        ipv4_address: 172.28.0.21

  doris-fe:
    image: apache/doris:fe-4.1.0
    container_name: doris-fe
    hostname: fe1
    environment:
      FE_SERVERS: "fe1:172.28.0.30:9010"
      FE_ID: "1"
    ports:
      - "8030:8030"
      - "9020:9020"
      - "9030:9030"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://127.0.0.1:8030/api/bootstrap >/dev/null || curl -fsS http://127.0.0.1:8030 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    volumes:
      - ./data/doris/fe/meta:/opt/apache-doris/fe/doris-meta
      - ./data/doris/fe/log:/opt/apache-doris/fe/log
    networks:
      lakehouse:
        ipv4_address: 172.28.0.30

  doris-be:
    image: apache/doris:be-4.1.0
    container_name: doris-be
    hostname: doris-be
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      FE_SERVERS: "fe1:172.28.0.30:9010"
      BE_ADDR: "172.28.0.31:9050"
    ports:
      - "8040:8040"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    restart: unless-stopped
    volumes:
      - ./data/doris/be/storage:/opt/apache-doris/be/storage
      - ./data/doris/be/log:/opt/apache-doris/be/log
    networks:
      lakehouse:
        ipv4_address: 172.28.0.31

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: prometheus
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    restart: unless-stopped
    networks:
      lakehouse:
        ipv4_address: 172.28.0.40

  grafana:
    image: grafana/grafana:13.1.0-25893932881
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./data/grafana:/var/lib/grafana
    networks:
      lakehouse:
        ipv4_address: 172.28.0.41

networks:
  lakehouse:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
